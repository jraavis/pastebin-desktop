name: Release macOS

# Triggers on any semver tag, e.g. v1.0.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual trigger from the Actions UI (creates a draft release)
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true

env:
  # Resolve the version tag once; works for both push-tag and manual triggers.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release-macos:
    name: Build & Release (macOS universal)
    runs-on: macos-14        # Apple Silicon; supports universal-apple-darwin builds

    permissions:
      contents: write        # create GitHub releases + upload assets

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both targets are required to produce a universal (fat) binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # ── 3. Cargo build cache ────────────────────────────────────────────────
      # First build: ~8–12 min. Subsequent builds with warm cache: ~2–4 min.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── 4. Code signing (optional) ──────────────────────────────────────────
      # This step only runs when the APPLE_CERTIFICATE secret is set.
      # Without it the app builds unsigned; users see a Gatekeeper prompt
      # that they can dismiss with right-click → Open.
      #
      # To enable signing, add these secrets under
      # repo Settings → Secrets and variables → Actions:
      #
      #   APPLE_CERTIFICATE          base64-encoded .p12 certificate
      #                              ( base64 -i cert.p12 | pbcopy )
      #   APPLE_CERTIFICATE_PASSWORD password used when exporting the .p12
      #   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAM)"
      #   APPLE_ID                   Apple ID email  (for notarisation)
      #   APPLE_PASSWORD             app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID              10-char team ID from developer.apple.com
      - name: Import Apple certificate into temporary keychain
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 20)

          # Create a short-lived keychain that only exists for this job.
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Decode and import the .p12 certificate.
          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

          # Make this keychain the default search list.
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Export path so later steps can clean up.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Propagate signing identity env vars only when the certificate is present.
      # This prevents Tauri from attempting to sign with an empty identity.
      - name: Export signing env vars
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}"                             >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"                 >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"                   >> "$GITHUB_ENV"

      # ── 5. Build & publish ──────────────────────────────────────────────────
      # tauri-apps/tauri-action:
      #   • installs the Tauri CLI
      #   • runs `tauri build --target universal-apple-darwin`
      #   • creates a draft GitHub Release
      #   • uploads the .dmg as a release asset
      #
      # Signing env vars (APPLE_SIGNING_IDENTITY etc.) are only present in
      # the environment when step 4 above ran, so unsigned builds work cleanly.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName:     ${{ env.RELEASE_TAG }}
          releaseName: "Pastebin Desktop ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## What's new

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Install

            1. Download **Pastebin_${{ env.RELEASE_TAG }}_universal.dmg** below.
            2. Open the DMG and drag **Pastebin.app** to your **Applications** folder.
            3. Launch from Applications or Spotlight.

            > **Unsigned build — macOS Gatekeeper:** if macOS says "unidentified developer",
            > right-click → **Open** once to allow it, or run:
            > ```sh
            > xattr -d com.apple.quarantine /Applications/Pastebin.app
            > ```
          releaseDraft: true     # review the release before publishing
          prerelease:   false
          args: --target universal-apple-darwin

      # ── 6. Cleanup keychain ─────────────────────────────────────────────────
      - name: Delete temporary keychain
        if: ${{ always() && env.KEYCHAIN_PATH != '' }}
        run: security delete-keychain "$KEYCHAIN_PATH"
