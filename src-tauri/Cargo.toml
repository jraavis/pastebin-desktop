[package]
name = "pastebin-gui"
version = "0.1.0"
description = "A modern Pastebin desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "clipboard-write-text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.36"

[features]
custom-protocol = ["tauri/custom-protocol"]
